services:

  grafana:
    build:
      context: ./grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "secret"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/sample/sample-dashboard.json"
    depends_on:
      - prometheus
    ports: 
      - "3000:3000"
    networks:
      - glasswing-power-network
    volumes:
      - type: bind
        source: "./dashboards/sample-dashboard.json"
        target: "/var/lib/grafana/dashboards/sample/sample-dashboard.json"
      - type: bind
        source: "./dashboards/power-cost-dashboard.json"
        target: "/var/lib/grafana/dashboards/power-cost/power-cost-dashboard.json"
  glasswing-power:
    image: glasswing-power:latest
    privileged: true
    ports: 
      - "8081:8080"
    volumes:
      - type: bind
        source: /proc
        target: /proc
      - type: bind
        source: /sys/class/powercap
        target: /sys/class/powercap
    command: ["prometheus"]                         
    networks:
      - glasswing-power-network

  gpu-power-exporter:
    build:
      context: ../gpu-power-exporter
    ports:
      - "8082:8082"
    privileged: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    volumes:
      - type: bind
        source: /usr/bin/nvidia-smi
        target: /usr/bin/nvidia-smi
        read_only: true
      - type: bind
        source: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so
        target: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so
        read_only: true
      - type: bind
        source: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
        target: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1
        read_only: true
      - type: bind
        source: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.595.99.02
        target: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.595.99.02
        read_only: true
    networks:
      - glasswing-power-network
    
  prometheus:
    build:
      context: ./prom
    ports: 
      - "9090:9090"
    volumes: 
      - promdata-glasswing-power:/prometheus 
    networks:
      - glasswing-power-network

volumes:
  promdata-glasswing-power:

networks:
  glasswing-power-network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.33.0/24
