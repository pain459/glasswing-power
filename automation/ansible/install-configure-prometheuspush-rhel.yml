- hosts: targets
  vars:
    rhel_version: 9
    glasswing_power_version: "dev0.5.10"
    pushgateway_host: localhost
    pushgateway_scheme: http
    pushgateway_port: 9092
    glasswing_power_config_path: /etc/glasswing-power/prometheuspush
    service_name: glasswing-power-prometheuspush
  tasks:
    #- name: Ensure glasswing-power package is purged
    #  shell: "dnf remove -y {{  }}"
    - name: Install RPM package
      shell: "dnf install -y https://glasswing-power.s3.fr-par.scw.cloud/x86_64/glasswing-power-prometheuspush-{{ glasswing_power_version }}-1.el{{ rhel_version }}.x86_64.rpm" 
    - name: Refresh systemd config
      shell: systemctl daemon-reload
    - name: Configure prometheus-push exporter to target push gateway
      lineinfile:
        path: "{{ glasswing_power_config_path }}"
        regexp: '^GLASSWING_POWER_ARGS=.*'
        backrefs: true
        line: "GLASSWING_POWER_ARGS=\"prometheus-push -H {{ pushgateway_host }} -S {{ pushgateway_scheme }} -p {{ pushgateway_port }} -s 30\""
        state: present
    - name: Start & enable service
      shell: "systemctl restart {{ service_name }} && systemctl enable {{ service_name }}"
    - name: Check service state
      shell: "systemctl status {{ service_name }}"
      register: result
    - name: Display error if failed
      fail:
        msg: "STDOUT: {{ result.stdout }} STDERR: {{ result.stderr }}"
      when: result.rc != 0
