[package]
name = "glasswing-power"
version = "1.0.2"
authors = ["Benoit Petit <bpetit@hubblo.org>", "pain459"]
edition = "2024"
license = "MIT"
description = "Electric power/energy consumption monitoring agent."
repository = "https://github.com/pain459/glasswing-power"
readme = "README.md"
homepage = "https://github.com/pain459/glasswing-power"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
loggerv = "0.7"
log = "0.4"
clap = { version = "4.2", features = ["cargo", "derive"] }
regex = "1.7"
riemann_client = { version = "1.0.0", optional = true }
hostname = "0.3.1"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
ordered-float = "2.0"
warp10 = { version = "3.0", optional = true }
time = "0.3"
colored = "2.0"
chrono = "0.4"
docker-sync = { version = "0.1.2", optional = true }
k8s-sync = { version = "0.2.3", optional = true }
hyper = { version = "0.14", features = ["full"], optional = true }
tokio = { version = "1.26.0", features = ["full"], optional = true }
sysinfo = { version = "0.40" }
isahc = { version = "1.7.2", optional = true }
ctrlc = { version = "3.4", features = ["termination"] }

[target.'cfg(target_os="linux")'.dependencies]
procfs = { version = "0.15.0" }



[features]
default = [
    "prometheus",
    "warpten",
    "json",
    "containers",
    "prometheuspush",
    "qemu",
]
prometheus = ["hyper", "tokio"]
riemann = ["riemann_client"]
json = ["serde", "serde_json"]
containers = ["docker-sync", "k8s-sync"]
warpten = ["warp10"]
prometheuspush = ["isahc"]
qemu = []
